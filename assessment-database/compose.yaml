services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment_local
      POSTGRES_DB: assessment_db
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - assessment_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U assessment -d assessment_db']
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  assessment_postgres:
